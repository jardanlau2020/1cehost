name: IceHost Probe (WAF/CF 探路，零憑據)

on:
  workflow_dispatch:
    inputs:
      use_warp:
        description: '用 Cloudflare WARP 換出口 IP（系統級全局）'
        type: boolean
        default: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 設置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安裝依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 🌍 掛 Cloudflare WARP（系統級全局，唔係 socks）
        if: ${{ inputs.use_warp }}
        continue-on-error: true
        uses: fscarmen/warp-on-actions@v1.1

      - name: 📍 確認出口 IP
        continue-on-error: true
        run: |
          echo "出口 IP: $(curl -s4 --max-time 15 https://api.ipify.org || echo n/a)"
          curl -s4 --max-time 15 https://ipinfo.io/json || true

      - name: 🔍 探路（WARP 生效後係全局，唔設 PROBE_PROXY）
        env:
          PROBE_URL: https://dash.icehost.pl/
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 probe.py

      - name: 📸 上傳截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icehost-probe-screenshots
          path: probe_*.png
          if-no-files-found: ignore
          retention-days: 3
