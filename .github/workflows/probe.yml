name: IceHost Probe (WAF/CF 探路，零憑據)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 設置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安裝依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 🔍 探路（直連，唔用代理）
        env:
          PROBE_URL: https://dash.icehost.pl/
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 probe.py

      - name: 📸 上傳截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icehost-probe-screenshots
          path: probe_*.png
          if-no-files-found: ignore
          retention-days: 3
