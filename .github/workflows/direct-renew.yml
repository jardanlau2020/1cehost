name: Auto Renew

# 1cehost 续期主流程。业务逻辑在 main.py；Python/依赖/通知/退出码这些通用部分
# 走 renew-kit 的 composite action，不再手写。
#
# ── 排程：cron 只是兜底，真正的保障靠外部触发 ──────────────────────────
# 面板的续期窗口是 6 小时，而且必须「过期之后」才能续（见 README 的实测），
# 所以触发频率必须高于 6 小时，否则一次 miss 就可能 suspended
# （2026-09-16 病史：miss 2 次 → 服务器 suspended）。
#
# 2026-11-23 实测：GitHub 对高频 schedule 有丢弃，不能按 cron 表达式算频率。
# 本仓 2026-10-14~11-23 共 400 个 run：cron 声明 24 次/天，schedule 实际只落到
# 每天 3~5 次，间隔 4.2~9.4h（均值约 7h）—— 达成率 15~20%。
# 对照组（公开实测）：声明 4 次/小时实得 1~2 次，改成 2 次/小时实得仍是 1~2 次，
# 说明 cron 表达式只是「上限」，不是「合同」，加时间点不会变多。
#
# ⇒ 真正的触发源是大阪 VPS 的 crontab（每小时 :07 dispatch 一次），见文件末尾。
#   2026-11-23 由 CEO 批准从 `*/30` 降为每小时：面板 6 小时冷却，30 分钟一轮里 47/48
#   是空跑，而空跑也会真点一次续期按钮（WAF 特征），每小时仍在窗口内留 6 次机会。
#   时区提醒：那台 VPS 是 US/Eastern，cron 按 EST 计时，脚本日志用 UTC，差 5 小时；
#   但 EST :07 = UTC :07 = 北京 :07，分钟数下不受影响。
#   cron 保留 `17 * * * *` 只作兜底；取 :17 而不是 :00，因为整点是全球 cron 扎堆的
#   高峰，GitHub 官方明确说高负载时段包含「每小时开始」，实测挪到奇数分钟能显著
#   降低延迟。
#
# 窗口没开时脚本静默 exit 0，也不发 TG（见 main.py 的 should_notify）。

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 僅供手動觸發(留空即可)
        required: false
      dry_run:
        description: Dry run（只检查、不点击续期）
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  renew:
    name: Renew ${{ matrix.account }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 同一账号的两次运行不重叠：浏览器启动 + 过盾要几分钟，撞在一起容易被面板
    # 当成异常流量。cancel-in-progress=false 让后来的排队而不是掐掉前一个。
    concurrency:
      group: direct-renew-${{ matrix.account }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        account: ["01", "02"]

    steps:
      - uses: actions/checkout@v7

      # 出口 IP 只做记录。面板前面有 WAF，真出问题时第一件事就是看出口换没换。
      - name: 📍 确认出口 IP
        continue-on-error: true
        run: |
          echo "Runner 出口 IP: $(curl -s --max-time 15 https://api.ipify.org || echo n/a)"
          curl -s --max-time 15 https://ipinfo.io/json || true

      - name: 🔄 执行自动续期（renew-kit）
        uses: jardanlau2020/renew-kit/.github/actions/renew@v0.6.0
        with:
          script: main.py
          python-version: "3.12"
          # 钉版本号而不是 @main：main 上出过一次 composite action 的语法错，
          # 所有 @main 的仓库一起变红。升级是显式动作，改这里两个 v0.4.2 即可。
          renewkit-ref: v0.6.0
          apt-packages: "xvfb x11-utils xdotool scrot fonts-noto-cjk"
          pip-packages: "seleniumbase==4.57.1 requests"   # 2026-11-15 釘版：4.58.0 令 uc_open_with_reconnect 死 driver（MaxRetryError window/handles）
          # 代理是「尽力而为」：装不成或探不通都退回直连，所以保持默认的
          # continue-on-error=true，绝不因为代理挂了而中断续期。
          setup-command: "bash scripts/setup_proxy.sh"
          # SeleniumBase 的 UC 模式要真实 X 显示才能发系统级点击（过 CF 盾），
          # 所以主命令得套 xvfb-run，不能用默认的 python main.py。
          command: 'xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 main.py'
          artifact-paths: "*.png"
          artifact-name: icehost-screenshots-${{ matrix.account }}
          notify-on-failure: "true"
        env:
          ICEHOST_ACCOUNT_NAME: ${{ matrix.account }}
          ICEHOST_SERVER_URL: ${{ matrix.account == '01' && secrets.ICEHOST_SERVER_URL || secrets.ICEHOST_SERVER_URL_02 }}
          ICEHOST_COOKIES: ${{ matrix.account == '01' && secrets.ICEHOST_COOKIES || secrets.ICEHOST_COOKIES_02 }}
          ICEHOST_EMAIL: ${{ matrix.account == '01' && secrets.ICEHOST_EMAIL || secrets.ICEHOST_EMAIL_02 }}
          ICEHOST_PASSWORD: ${{ matrix.account == '01' && secrets.ICEHOST_PASSWORD || secrets.ICEHOST_PASSWORD_02 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 2026-11-23：原先这里传 ICEHOST_NEAR_EXPIRY_S="7200"（剩 ≤2h 算临近到期）。
          # 后来查明站方机制是「**必须过期之后才能续**」——剩 1h 被拒也是预期，不是异常，
          # 那个 2h 阈值会把常态误判成 FAILED。判据已改成按「到期日是否已到（当天或更早）」，
          # 常量 NEAR_EXPIRY_S 已删除，所以这个 env 一并去掉，别再加回来。
          # 详见 README「站点机制：必须过期之后才能续」与 main.py 的 _expired_on()。
          # ⚠️ NODE_LINK 必须传给 setup_proxy.sh，否则上游 installer 的
          # `export NODE_LINK=${NODE_LINK:-''}` 取到空值，直接走「未配置代理，
          # 直连模式」，一声不响地退回 runner 机房 IP —— 那个 IP 在面板 WAF 的
          # 默认拒绝名单里。实盘 #241 就是漏了这一行红的（迁移时从原 workflow
          # 的代理 step 里丢了）。setup_proxy.sh 里也加了空值告警兜底。
          NODE_LINK: ${{ secrets.NODE_LINK }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

# ══════════════════════════════════════════════════════════════════════════
# 外部触发源 —— 别再查「谁在 dispatch」了，就是这里
#
#   主机     159.13.38.22（大阪 VPS，Debian 10，root）
#   脚本     /root/.config/scripts/1cehost-dispatch.sh      chmod 700 root:root
#   crontab  */30 * * * * /root/.config/scripts/1cehost-dispatch.sh
#   凭据     /root/.config/1cehost-token                    chmod 600 root:root
#            脚本内 `TOKEN=$(cat ...)` 引用；不进命令行、不打印、不进日志
#   日志     /var/log/1cehost-dispatch.log                  chmod 600
#            每行 = UTC 时间 + HTTP 状态码（204 = dispatch 成功）
#
# 由来：2026-11-23 查「为什么每小时的 cron 每天只跑 3~5 次」时，发现一半 run 是
# workflow_dispatch 却没人认领，查了好几轮才定位到这个外部脚本。所以把出处写死在
# 这里，避免下次再变成悬案。
#
# 想停掉它：`crontab -e` 删掉那行，或 `chmod -x /root/.config/scripts/1cehost-dispatch.sh`。
# 相关的节流实测数据见本文件开头的排程说明。
# ══════════════════════════════════════════════════════════════════════════
