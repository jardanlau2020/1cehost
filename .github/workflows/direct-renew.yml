name: Auto Renew

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 僅供手動觸發(留空即可)
        required: false
  schedule:
    # 定案:只做 A 基礎 cron,唔開 B 臨近加密(慳位俾其他項目)
    # 每 5 小時跑一次: 5 次/日 x 2 帳號 x ≈3 分鐘 ≈ 30 分鐘/日 ≈ 900–1200 分鐘/月
    # ⚠ 本仓係私有仓, Free plan 帳號共享免費額度 2000 分鐘/月(非公開仓 5000):
    # 5h 消耗 ~900–1200/月, 穩陣喺 2000 以內, 剩 800+ 分鐘俾其他私有倉項目
    # 6 小時續期窗口內仍有 ~1.2 次嘗試 + 到期後 72 小時緩衝兜底, 確保項目本身正常
    # 窗口未開時脚本靜默 exit 0, 冷卻期內再撳一樣靜默返回, 唔會 spam TG
    # UTC 時間, 對應北京時間 +8
    # 2026-09-16 病史: 5h cron 追唔切 6h 窗口(窗口開先准撳), miss 2 次即 suspended
    # 本仓已转 public=Actions 免费, 直接每小时一跑保证窗口必中
    - cron: '0 * * * *'

jobs:
  renew:
    name: Renew ${{ matrix.account }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        account: ["01", "02"]

    steps:
      - uses: actions/checkout@v7

      - name: ⚙ 設置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 🛠️ 安裝依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 📍 確認出口 IP
        continue-on-error: true
        run: |
          echo "Runner 出口 IP: $(curl -s --max-time 15 https://api.ipify.org || echo n/a)"
          curl -s --max-time 15 https://ipinfo.io/json || true

      - name: ⚙ 设置代理 (sing-box, 可选)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🔄 執行自動續期(Cookie 優先,Cookie 失效自動轉密碼登入)
        env:
          ICEHOST_ACCOUNT_NAME: ${{ matrix.account }}
          ICEHOST_SERVER_URL: ${{ matrix.account == '01' && secrets.ICEHOST_SERVER_URL || secrets.ICEHOST_SERVER_URL_02 }}
          ICEHOST_COOKIES: ${{ matrix.account == '01' && secrets.ICEHOST_COOKIES || secrets.ICEHOST_COOKIES_02 }}
          ICEHOST_EMAIL: ${{ matrix.account == '01' && secrets.ICEHOST_EMAIL || secrets.ICEHOST_EMAIL_02 }}
          ICEHOST_PASSWORD: ${{ matrix.account == '01' && secrets.ICEHOST_PASSWORD || secrets.ICEHOST_PASSWORD_02 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # [採自上游 nelgevbe/Icehost-Renew renew.yml 2026-08-24 版]
          # 上游原則:「進程存在」唔等於「代理通」——真連一次 ipify 先算數。
          # 本仓之前只 pgrep sing-box 就當通,一旦 setup_proxy.sh 半途失敗
          # (該步 continue-on-error),成個續期會行喺死代理上面。
          # 呢度只做「驗證 + 回退直連」,唔會因為代理唔通而中斷續期。
          PROXY_SERVER=""
          if pgrep -f sing-box >/dev/null 2>&1; then
            for i in 1 2 3; do
              _exit_ip=$(curl -s --max-time 15 -x socks5h://127.0.0.1:1080 https://api.ipify.org || true)
              if [ -n "$_exit_ip" ]; then
                PROXY_SERVER="socks5://127.0.0.1:1080"
                echo "using proxy: socks5://127.0.0.1:1080 (第 $i 次探測成功, 出口 IP: $_exit_ip)"
                break
              fi
              echo "⚠️ proxy 第 $i 次探測唔通, 3 秒後重試..."
              sleep 3
            done
            if [ -z "$PROXY_SERVER" ]; then
              echo "⚠️ sing-box 進程存在但代理 3 次都唔通 → 回退直連(唔中斷續期)"
            fi
          else
            echo "no proxy, direct mode"
          fi
          export PROXY_SERVER
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 main.py

      - name: 📸 上傳截圖
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: direct-renew-${{ matrix.account }}
          path: run_screenshot.png
          if-no-files-found: ignore
          retention-days: 3
