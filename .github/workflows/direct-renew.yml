        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  renew:
    name: Renew ${{ matrix.account }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 鍚屼竴璐﹀彿鐨勪袱娆¤繍琛屼笉閲嶅彔锛氭祻瑙堝櫒鍚姩 + 杩囩浘瑕佸嚑鍒嗛挓锛屾挒鍦ㄤ竴璧峰鏄撹闈㈡澘
    # 褰撴垚寮傚父娴侀噺銆俢ancel-in-progress=false 璁╁悗鏉ョ殑鎺掗槦鑰屼笉鏄帎鎺夊墠涓€涓€?
    concurrency:
      group: direct-renew-${{ matrix.account }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        account: ["01", "02"]

    steps:
      - uses: actions/checkout@v7

      # 鍑哄彛 IP 鍙仛璁板綍銆傞潰鏉垮墠闈㈡湁 WAF锛岀湡鍑洪棶棰樻椂绗竴浠朵簨灏辨槸鐪嬪嚭鍙ｆ崲娌℃崲銆?
      - name: 馃搷 纭鍑哄彛 IP
        continue-on-error: true
        run: |
          echo "Runner 鍑哄彛 IP: $(curl -s --max-time 15 https://api.ipify.org || echo n/a)"
          curl -s --max-time 15 https://ipinfo.io/json || true

      - name: 馃攧 鎵ц鑷姩缁湡锛坮enew-kit锛?
        uses: jardanlau2020/renew-kit/.github/actions/renew@v0.6.0
        with:
          script: main.py
          python-version: "3.12"
          # 閽夌増鏈彿鑰屼笉鏄?@main锛歮ain 涓婂嚭杩囦竴娆?composite action 鐨勮娉曢敊锛?
          # 鎵€鏈?@main 鐨勪粨搴撲竴璧峰彉绾€傚崌绾ф槸鏄惧紡鍔ㄤ綔锛屾敼杩欓噷涓や釜 v0.4.2 鍗冲彲銆?
          renewkit-ref: v0.6.0
          apt-packages: "xvfb x11-utils xdotool scrot fonts-noto-cjk"
          pip-packages: "seleniumbase==4.57.1 requests"   # 2026-11-15 閲樼増锛?.58.0 浠?uc_open_with_reconnect 姝?driver锛圡axRetryError window/handles锛?
          # 浠ｇ悊鏄€屽敖鍔涜€屼负銆嶏細瑁呬笉鎴愭垨鎺笉閫氶兘閫€鍥炵洿杩烇紝鎵€浠ヤ繚鎸侀粯璁ょ殑
          # continue-on-error=true锛岀粷涓嶅洜涓轰唬鐞嗘寕浜嗚€屼腑鏂画鏈熴€?
          setup-command: "bash scripts/setup_proxy.sh"
          # SeleniumBase 鐨?UC 妯″紡瑕佺湡瀹?X 鏄剧ず鎵嶈兘鍙戠郴缁熺骇鐐瑰嚮锛堣繃 CF 鐩撅級锛?
          # 鎵€浠ヤ富鍛戒护寰楀 xvfb-run锛屼笉鑳界敤榛樿鐨?python main.py銆?
          command: 'xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 main.py'
          artifact-paths: "*.png"
          artifact-name: icehost-screenshots-${{ matrix.account }}
          notify-on-failure: "true"
        env:
          ICEHOST_ACCOUNT_NAME: ${{ matrix.account }}
          ICEHOST_SERVER_URL: ${{ matrix.account == '01' && secrets.ICEHOST_SERVER_URL || secrets.ICEHOST_SERVER_URL_02 }}
          ICEHOST_COOKIES: ${{ matrix.account == '01' && secrets.ICEHOST_COOKIES || secrets.ICEHOST_COOKIES_02 }}
          ICEHOST_EMAIL: ${{ matrix.account == '01' && secrets.ICEHOST_EMAIL || secrets.ICEHOST_EMAIL_02 }}
          ICEHOST_PASSWORD: ${{ matrix.account == '01' && secrets.ICEHOST_PASSWORD || secrets.ICEHOST_PASSWORD_02 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
