name: IceHost Renew

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 僅供手動觸發(留空即可)
        required: false
  schedule:
    # 每 5 小時跑一次(免費機每 6 小時到期,留 1 小時緩衝)
    # UTC 時間,對應北京時間 +8
    - cron: '0 */5 * * *'

jobs:
  remind:
    name: IceHost 續期提醒
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🔔 發送 Telegram 續期提醒
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SERVER_URL_01: ${{ secrets.ICEHOST_SERVER_URL || 'https://dash.icehost.pl/server/7dae0ce5' }}
          SERVER_URL_02: ${{ secrets.ICEHOST_SERVER_URL_02 || 'https://dash.icehost.pl/server/e659dad6' }}
        run: |
          TEXT=$(printf '%s\n' \
            '🔔 IceHost 續期提醒(人手操作)' \
            '' \
            '自動續期因平台登入限制已停用,請你登入 https://dash.icehost.pl 後:' \
            '' \
            "1. 開 01: ${SERVER_URL_01}" \
            "2. 開 02: ${SERVER_URL_02}" \
            '3. 兩邊各自撳「ADD 6 HOURS VALIDITY」' \
            '4. 確認 EXPIRATION DATE 有推遲 6 小時' \
            '' \
            '⚠️ 超過 72 小時未續期,伺服器連檔一齊刪。')
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
