          # 鍚庢潵鏌ユ槑绔欐柟鏈哄埗鏄€?*蹇呴』杩囨湡涔嬪悗鎵嶈兘缁?*銆嶁€斺€斿墿 1h 琚嫆涔熸槸棰勬湡锛屼笉鏄紓甯革紝
          # 閭ｄ釜 2h 闃堝€间細鎶婂父鎬佽鍒ゆ垚 FAILED銆傚垽鎹凡鏀规垚鎸夈€屽埌鏈熸棩鏄惁宸插埌锛堝綋澶╂垨鏇存棭锛夈€嶏紝
          # 甯搁噺 NEAR_EXPIRY_S 宸插垹闄わ紝鎵€浠ヨ繖涓?env 涓€骞跺幓鎺夛紝鍒啀鍔犲洖鏉ャ€?
          # 璇﹁ README銆岀珯鐐规満鍒讹細蹇呴』杩囨湡涔嬪悗鎵嶈兘缁€嶄笌 main.py 鐨?_expired_on()銆?
          # 鈿狅笍 NODE_LINK 蹇呴』浼犵粰 setup_proxy.sh锛屽惁鍒欎笂娓?installer 鐨?
          # `export NODE_LINK=${NODE_LINK:-''}` 鍙栧埌绌哄€硷紝鐩存帴璧般€屾湭閰嶇疆浠ｇ悊锛?
          # 鐩磋繛妯″紡銆嶏紝涓€澹颁笉鍝嶅湴閫€鍥?runner 鏈烘埧 IP 鈥斺€?閭ｄ釜 IP 鍦ㄩ潰鏉?WAF 鐨?
          # 榛樿鎷掔粷鍚嶅崟閲屻€傚疄鐩?#241 灏辨槸婕忎簡杩欎竴琛岀孩鐨勶紙杩佺Щ鏃朵粠鍘?workflow
          # 鐨勪唬鐞?step 閲屼涪浜嗭級銆俿etup_proxy.sh 閲屼篃鍔犱簡绌哄€煎憡璀﹀厹搴曘€?
          NODE_LINK: ${{ secrets.NODE_LINK }}
