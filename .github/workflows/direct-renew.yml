name: IceHost Renew

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 僅供手動觸發(留空即可)
        required: false
  schedule:
    # 每 5 小時跑一次(免費機每 6 小時到期,留 1 小時緩衝)
    # UTC 時間,對應北京時間 +8
    - cron: '0 */5 * * *'

jobs:
  renew:
    name: IceHost ${{ matrix.account }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        account: ["01", "02"]

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 設置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安裝依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 📍 確認出口 IP
        continue-on-error: true
        run: |
          echo "Runner 出口 IP: $(curl -s --max-time 15 https://api.ipify.org || echo n/a)"
          curl -s --max-time 15 https://ipinfo.io/json || true

      - name: ⚙ 设置代理 (sing-box, 可选)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🔄 執行 IceHost 自動續期(Cookie 優先,Cookie 失效自動轉密碼登入)
        env:
          ICEHOST_ACCOUNT_NAME: ${{ matrix.account == '01' && 'IceHost 01' || 'IceHost 02' }}
          ICEHOST_SERVER_URL: ${{ matrix.account == '01' && secrets.ICEHOST_SERVER_URL || secrets.ICEHOST_SERVER_URL_02 }}
          ICEHOST_COOKIES: ${{ matrix.account == '01' && secrets.ICEHOST_COOKIES || secrets.ICEHOST_COOKIES_02 }}
          ICEHOST_EMAIL: ${{ matrix.account == '01' && secrets.ICEHOST_EMAIL || secrets.ICEHOST_EMAIL_02 }}
          ICEHOST_PASSWORD: ${{ matrix.account == '01' && secrets.ICEHOST_PASSWORD || secrets.ICEHOST_PASSWORD_02 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if pgrep -f sing-box >/dev/null 2>&1; then
            export PROXY_SERVER="socks5://127.0.0.1:1080"
            echo "using proxy: socks5://127.0.0.1:1080"
          else
            export PROXY_SERVER=""
            echo "no proxy, direct mode"
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 icehost_run.py

      - name: 📸 上傳截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icehost-direct-renew-${{ matrix.account }}
          path: icehost_debug_screenshot.png
          if-no-files-found: ignore
          retention-days: 3
