name: Auto Renew

# 1cehost 续期主流程。业务逻辑在 main.py；Python/依赖/通知/退出码这些通用部分
# 走 renew-kit 的 composite action，不再手写。
#
# 排程：每小时一次。面板的续期窗口是 6 小时，而且「窗口开了才准点」，
# 5 小时一次的 cron 追不上窗口（2026-09-16 病史：miss 2 次 → 服务器 suspended）。
# 本仓已转 public，Actions 分钟数免费，所以直接每小时跑，保证窗口必中。
# 窗口没开时脚本静默 exit 0，也不发 TG（见 main.py 的 should_notify）。

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 僅供手動觸發(留空即可)
        required: false
      dry_run:
        description: Dry run（只检查、不点击续期）
        type: boolean
        default: false
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  renew:
    name: Renew ${{ matrix.account }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 同一账号的两次运行不重叠：浏览器启动 + 过盾要几分钟，撞在一起容易被面板
    # 当成异常流量。cancel-in-progress=false 让后来的排队而不是掐掉前一个。
    concurrency:
      group: direct-renew-${{ matrix.account }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        account: ["01", "02"]

    steps:
      - uses: actions/checkout@v7

      # 出口 IP 只做记录。面板前面有 WAF，真出问题时第一件事就是看出口换没换。
      - name: 📍 确认出口 IP
        continue-on-error: true
        run: |
          echo "Runner 出口 IP: $(curl -s --max-time 15 https://api.ipify.org || echo n/a)"
          curl -s --max-time 15 https://ipinfo.io/json || true

      - name: 🔄 执行自动续期（renew-kit）
        uses: jardanlau2020/renew-kit/.github/actions/renew@v0.5.3
        with:
          script: main.py
          python-version: "3.12"
          # 钉版本号而不是 @main：main 上出过一次 composite action 的语法错，
          # 所有 @main 的仓库一起变红。升级是显式动作，改这里两个 v0.4.2 即可。
          renewkit-ref: v0.5.3
          apt-packages: "xvfb x11-utils xdotool scrot fonts-noto-cjk"
          pip-packages: "seleniumbase requests"
          # 代理是「尽力而为」：装不成或探不通都退回直连，所以保持默认的
          # continue-on-error=true，绝不因为代理挂了而中断续期。
          setup-command: "bash scripts/setup_proxy.sh"
          # SeleniumBase 的 UC 模式要真实 X 显示才能发系统级点击（过 CF 盾），
          # 所以主命令得套 xvfb-run，不能用默认的 python main.py。
          command: 'xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 main.py'
          artifact-paths: "*.png"
          artifact-name: icehost-screenshots-${{ matrix.account }}
          notify-on-failure: "true"
        env:
          ICEHOST_ACCOUNT_NAME: ${{ matrix.account }}
          ICEHOST_SERVER_URL: ${{ matrix.account == '01' && secrets.ICEHOST_SERVER_URL || secrets.ICEHOST_SERVER_URL_02 }}
          ICEHOST_COOKIES: ${{ matrix.account == '01' && secrets.ICEHOST_COOKIES || secrets.ICEHOST_COOKIES_02 }}
          ICEHOST_EMAIL: ${{ matrix.account == '01' && secrets.ICEHOST_EMAIL || secrets.ICEHOST_EMAIL_02 }}
          ICEHOST_PASSWORD: ${{ matrix.account == '01' && secrets.ICEHOST_PASSWORD || secrets.ICEHOST_PASSWORD_02 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # ⚠️ NODE_LINK 必须传给 setup_proxy.sh，否则上游 installer 的
          # `export NODE_LINK=${NODE_LINK:-''}` 取到空值，直接走「未配置代理，
          # 直连模式」，一声不响地退回 runner 机房 IP —— 那个 IP 在面板 WAF 的
          # 默认拒绝名单里。实盘 #241 就是漏了这一行红的（迁移时从原 workflow
          # 的代理 step 里丢了）。setup_proxy.sh 里也加了空值告警兜底。
          NODE_LINK: ${{ secrets.NODE_LINK }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
