name: IceHost Discover Server URL

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 設置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安裝依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 📍 出口 IP
        continue-on-error: true
        run: |
          echo "Runner 出口 IP: $(curl -s --max-time 15 https://api.ipify.org || echo n/a)"

      - name: 🔎 自動搵 server edit URL
        env:
          ICEHOST_COOKIES: ${{ secrets.ICEHOST_COOKIES }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 discover_server.py

      - name: 📸 上傳截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icehost-discover
          path: discover_screenshot.png
          if-no-files-found: ignore
          retention-days: 3